plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.138'
}

version = project.properties['mod_version'] ?: '1.0.0'
group = project.properties['mod_group'] ?: 'net.george.cmmplus'

base {
    archivesName = "CMMPlus-${project.properties['minecraft_version'] ?: '1.21.1'}"
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories { mavenCentral() }

// Create 6.0.10 + its jarjar deps (Flywheel / Ponder / Registrate), CMM 2.7.
// Provided by the pack at runtime, so compileOnly + runtimeOnly.
dependencies {
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    runtimeOnly fileTree(dir: 'libs', include: '*.jar')
}

neoForge {
    version = project.properties['neoforge_version'] ?: '21.1.234'
    runs {
        client { client() }
        server { server() }
        // Functional test: builds fan and crushing wheel rigs in the spawn area, measures the
        // tier machines and stops the server again.  See TierMachineSelfTest.
        selfTest {
            server()
            systemProperty 'cmmplus.selftest', 'true'
        }
    }
    mods {
        cmmplus { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }